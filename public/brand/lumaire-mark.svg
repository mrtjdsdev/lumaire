<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <clipPath id="innerCircle">
      <circle cx="50" cy="50" r="41" />
    </clipPath>
  </defs>
  <g clip-path="url(#innerCircle)">
    <!-- Solid Left Semicircle -->
    <rect x="0" y="0" width="50" height="100" fill="#231F1D" />
    <!-- Column 1 Halftone Dots -->
    <circle cx="60.5" cy="28.5" r="5.6" fill="#231F1D" />
    <circle cx="60.5" cy="50" r="5.6" fill="#231F1D" />
    <circle cx="60.5" cy="71.5" r="5.6" fill="#231F1D" />
    <!-- Column 2 Halftone Dots -->
    <circle cx="74.5" cy="35.5" r="4.6" fill="#231F1D" />
    <circle cx="74.5" cy="56.5" r="4.6" fill="#231F1D" />
    <circle cx="74.5" cy="76.5" r="4.6" fill="#231F1D" />
    <!-- Column 3 Rim Halftone Dots -->
    <circle cx="86.5" cy="43" r="3.4" fill="#231F1D" />
    <circle cx="86.5" cy="60.5" r="3.4" fill="#231F1D" />
  </g>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="42.5" stroke="#231F1D" stroke-width="5.5" />
</svg>
